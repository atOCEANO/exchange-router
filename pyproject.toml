[build-system]
requires      = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name            = "exchange-router"
description     = "One API over public crypto market data, in this process or against a running service"
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE"]
requires-python = ">=3.10"
dynamic         = ["version"]
authors         = [{ name = "atOCEANO" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "httpx>=0.24.0",
    "pandas>=2.0,<3.0",
    "websockets>=12.0,<16.0",
    "pydantic>=2.0,<3.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
server = [
    "fastapi==0.123.0",
    "uvicorn[standard]==0.38.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]
audit = [
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/atOCEANO/exchange-router"

[tool.setuptools.dynamic]
version = { attr = "exchange_router.version.VERSION" }

[tool.setuptools.packages.find]
include = ["exchange_router*"]

[tool.setuptools.package-data]
exchange_router = ["py.typed"]

[tool.pytest.ini_options]
pythonpath                        = ["."]
testpaths                         = ["tests"]
asyncio_mode                      = "auto"
asyncio_default_fixture_loop_scope = "function"
