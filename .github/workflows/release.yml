name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: the tag matches the version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: compare the tag against exchange_router/version.py
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src=$(sed -n 's/^VERSION *= *"\(.*\)"/\1/p' exchange_router/version.py)
          echo "tag ${GITHUB_REF_NAME} -> ${tag}"
          echo "exchange_router/version.py -> ${src}"
          if [ -z "$src" ]; then
            echo "::error::could not read VERSION out of exchange_router/version.py"
            exit 1
          fi
          if [ "$tag" != "$src" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${src}; bump exchange_router/version.py or move the tag"
            exit 1
          fi

  build:
    name: the wheel and the sdist build
    needs: [version]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install build
      - run: python -m build
      - name: the built version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls -l dist/
          test -f "dist/exchange_router-${tag}-py3-none-any.whl" || {
            echo "::error::no wheel named for ${tag} in dist/"; exit 1; }
          test -f "dist/exchange_router-${tag}.tar.gz" || {
            echo "::error::no sdist named for ${tag} in dist/"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            `exchange-router` is a stateless, keyless router over public crypto
            market data. One schema, every registered adapter speaking it, and
            one Python API that runs either in your own process or against a
            service you deploy. A caller written against one exchange and market
            type works against another by changing the arguments.

            ## Install it

            ```bash
            pip install "git+https://github.com/atOCEANO/exchange-router.git@${{ github.ref_name }}"
            ```

            The wheel and the sdist are attached below if you would rather have
            the file. Requires Python 3.10 or newer.

            ```python
            from exchange_router import Router

            r = Router.local(exchanges=["binance"])
            print(r.market("binance", "spot", "BTCUSDT").ticker().price)

            df = r.get_candles("binance", "linear", "BTCUSDT", interval="1h", limit=100)
            print(df.tail())
            ```

            No `await`, and it runs identically in a script and in a notebook.
            The router holds live adapters, so release it when done: the `with`
            form guarantees cleanup, and outside one call `r.close()`.

            ## Point it at a service instead

            One line changes. Everything below it is the same object with the
            same methods returning the same types.

            ```python
            r = Router.service("http://localhost:8040", exchanges=["binance"])
            ```

            Both constructors require the exchange scope, and bare `Router(...)`
            raises rather than guessing. Local mode is for one researcher in one
            process; run the service as soon as there is more than one of
            anything, because each local process carries its own rate-limit
            budget and the exchange sees the sum.

            ## Run the service without Docker

            ```bash
            git clone --branch ${{ github.ref_name }} https://github.com/atOCEANO/exchange-router.git
            cd exchange-router
            python -m venv .venv
            source .venv/bin/activate
            pip install ".[server]"
            uvicorn exchange_router.service:app --port 8040
            ```

            On Windows, activate with `.venv\Scripts\activate`. The `[server]`
            extra is what adds FastAPI and uvicorn; the base install above has
            neither, on purpose.

            ## Run it with Docker

            The image is built from the repository, so there is no registry to
            pull from and nothing to trust but the source you just cloned:

            ```bash
            git clone --branch ${{ github.ref_name }} https://github.com/atOCEANO/exchange-router.git
            cd exchange-router
            cp .env.example .env
            docker compose up --build
            ```

            Compose binds to `127.0.0.1:8040` by default; set
            `EXCHANGE_ROUTER_SERVICE_PORT` in `.env` to move it. To skip compose,
            `docker build -t exchange-router-service .` and
            `docker run --rm -p 8040:8040 exchange-router-service`.

            Either way, confirm it is up:

            ```bash
            curl http://localhost:8040/version
            curl http://localhost:8040/exchanges
            ```

            ## Upgrading

            The package was `exchange-router-client` and is now `exchange-router`;
            the import is `exchange_router`. Every read method keeps its name,
            signature and return type, so a search and replace on the import line
            is the whole migration for code that already worked. The old
            `ExchangeRouterClient()` still exists, still defaults to localhost, and
            warns. The version appears to go backwards from client 5.1.1 because
            the service and the client used to be numbered separately and now are
            not; the number continues the service line, which is the one the tags
            and releases have always used.

            [Migration](https://github.com/atOCEANO/exchange-router/blob/${{ github.ref_name }}/.Documentation/Migration.md)
            has the detail, and
            [Python API](https://github.com/atOCEANO/exchange-router/blob/${{ github.ref_name }}/.Documentation/Python_API.md)
            is the full surface.

            ## What is in it

            - Every registered adapter behind one schema, across spot, linear and
              inverse markets. The set supported at this tag is listed in
              [Supported Exchanges](https://github.com/atOCEANO/exchange-router/blob/${{ github.ref_name }}/README.md#supported-exchanges);
              adding one is a new adapter and no change to the routing core.
            - One normalized wire format. Raw upstream dicts never cross the
              boundary; every response is a Pydantic model from `exchange_router/models.py`.
            - Nested value objects on every quantitative record: `qty`, `volume`
              and `open_interest` each come back as
              `{native, unit, contract_size?, usd, usd_basis?}`, so one record
              carries both the raw upstream value and a quote-currency notional
              with the conversion basis spelled out.
            - A `kind: "discrete" | "continuous"` discriminator on funding, so a
              position-PnL calculation branches on the funding model itself with no
              exchange-specific code.
            - Rate-limit and ban avoidance per upstream host: proactive backoff off
              the used-weight header, `Retry-After` honoured on 429 and 418, and a
              fail-fast 503 once retries are spent.
            - One upstream WebSocket per `(channel, symbol)` tuple, fanned out to
              every attached client and cancelled when the last subscriber leaves.

            ## Scope

            Public market data only. It places no orders, holds no API keys,
            manages no accounts, and writes nothing to disk. If you need
            authentication or private endpoints, this is not it.

            ## Verified

            Honestly and narrowly. The real suite is the auditor
            (`python -m tools.auditor`), and it runs against live exchange APIs
            from a developer machine, because hosted runners issue from datacenter
            IPs that several of these exchanges block. CI therefore checks only
            what needs no upstream: every adapter package registers an adapter and
            declares a non-empty capabilities map and at least one market type, the
            package installs into a clean interpreter with no FastAPI in it, the
            image builds and boots, the offline suite runs every call against
            both backends and asserts they agree, and this tag matches `VERSION`. Treat the
            auditor run, not this release, as the evidence that a given adapter is
            correct against its exchange.
