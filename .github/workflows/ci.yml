# Continuous integration: the half of the local loop that a hosted runner can
# actually do. The auditor is the real suite and it cannot run here, because
# exchange APIs block the datacenter IPs hosted runners issue from, which the
# Auditor Guide records under "why the suite runs locally, not in CI". So this
# checks what is checkable with no upstream: every adapter package registers an
# adapter and declares a usable capabilities map, the client SDK builds and
# installs clean, the image boots and answers on the routes that need no
# network, and the offline suite holds. It is a smaller claim than emsl's gate,
# deliberately.
#
# The suite is the newest of the four and the only one that can catch a
# behavioural regression. It reaches the app through an ASGI transport with a
# fake adapter in the registry, so it needs no container to talk to, no port and
# no upstream, and it runs on a blocked runner exactly as it runs on a laptop.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  adapters:
    name: adapters load and declare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # the floor the client declares, so the service is held to it too
      # the base install, with no server extra: the adapters must come up
      # without FastAPI on the machine, which is what makes local mode a real
      # claim rather than a packaging accident.
      - run: pip install .
      # load_exchanges() logs and swallows an adapter that fails to import
      # (exchange_router/exchanges/__init__.py), so a broken adapter leaves a
      # service running with one fewer exchange and nothing anywhere fails.
      # Counting the packages on disk against the registry is what turns that
      # into a red build. Nothing here touches the network: an adapter's
      # __init__ is documented as synchronous and lightweight, and
      # get_capabilities is a static declaration.
      - name: every adapter package registers an adapter
        run: |
          python - <<'PY'
          import pathlib
          import sys

          from exchange_router.exchanges import EXCHANGE_REGISTRY, load_exchanges

          root = pathlib.Path("exchange_router/exchanges")
          packages = sorted(
              p.name for p in root.iterdir() if p.is_dir() and (p / "__init__.py").exists()
          )
          load_exchanges()
          loaded = sorted(EXCHANGE_REGISTRY)

          print(f"packages on disk: {packages}")
          print(f"adapters loaded:  {loaded}")
          if len(loaded) != len(packages):
              sys.exit(
                  f"{len(packages)} adapter packages on disk but {len(loaded)} registered; "
                  f"load_exchanges swallows an import error, so check the job log above "
                  f"for a 'Failed to load adapter' line naming the one that did not come up"
              )

          for name, adapter in EXCHANGE_REGISTRY.items():
              caps = adapter.get_capabilities()
              if not isinstance(caps, dict) or not caps:
                  sys.exit(f"{name} get_capabilities returned {caps!r}, expected a non-empty dict")
              if not adapter.supported_market_types:
                  sys.exit(f"{name} declares no supported market types")
          print(f"{len(loaded)} adapters, each declaring capabilities and market types")
          PY

  package:
    name: the package installs and the base install carries no server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # this is the install the docs and the release notes tell people to run,
      # pointed at the checkout instead of at github, so a broken pyproject or a
      # dependency missing from it fails here rather than in someone's first pip
      # install. A clean venv, so nothing already on the runner can satisfy an
      # import the package forgot to declare.
      - name: install it into a clean interpreter
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install .
          /tmp/fresh/bin/python -c "import exchange_router as r; print('package', r.__version__)"
      # the split between the base install and the server extra is the whole
      # reason a library can exist here, so it is checked rather than asserted.
      # If FastAPI ever leaks into the base dependency list this goes red.
      - name: the base install pulls no FastAPI
        run: |
          /tmp/fresh/bin/python - <<'PY'
          import importlib.util
          import sys

          if importlib.util.find_spec("fastapi") is not None:
              sys.exit("fastapi reached a base install; it belongs to the server extra")
          print("no fastapi in the base install")
          PY
      # py.typed is what makes the annotations count for anyone type-checking
      # against this. It ships as package data and package data is easy to drop.
      - name: the type marker ships
        run: |
          /tmp/fresh/bin/python - <<'PY'
          import pathlib
          import sys

          import exchange_router

          marker = pathlib.Path(exchange_router.__file__).parent / "py.typed"
          if not marker.exists():
              sys.exit(f"py.typed is not in the installed package at {marker}")
          print("py.typed ships")
          PY

  image:
    name: the image boots and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ers-ci .
      # the lifespan preloads adapters over the network and every one of those
      # calls will fail on a blocked runner. That is fine and is the point of
      # checking these three routes: they are the ones served off the registry
      # and the version module, so they answer whether or not a warm succeeded.
      - name: boot it and check the routes that need no upstream
        run: |
          id=$(docker run -d -p 8040:8040 ers-ci)
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8040/status >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8040/status
          curl -fsS http://127.0.0.1:8040/version
          curl -fsS http://127.0.0.1:8040/exchanges
          count=$(curl -fsS http://127.0.0.1:8040/exchanges | python -c "import json,sys; print(json.load(sys.stdin)['count'])")
          docker logs "$id"
          docker rm -f "$id" >/dev/null
          test "$count" -gt 0 || { echo "::error::the service came up with no exchanges registered"; exit 1; }

  suite:
    name: the offline suite holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the test stage sits between the shared base and the service stage, so a
      # plain `docker build` still produces the service and the test
      # dependencies never reach the image anyone runs.
      - run: docker build --target test -t ers-test .
      - name: run the suite in the image it was built into
        run: docker run --rm ers-test pytest -q
